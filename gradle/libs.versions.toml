[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
ksp = "2.3.12"
agp = "9.5.0-alpha10"
lifecycle = "2.11.0"
lifecycle-viewmodelNav3 = "2.11.0"
splashscreen = "1.2.0"
activity = "1.13.0"
compose = "2026.09.00"
navigation = "1.2.0"
compose-adaptive = "1.3.0"
m3x = "0.1.0-alpha01"
coil = "3.6.3"
room = "2.8.5"
datastore = "1.2.1"
preference = "1.2.1"
kaidl = "0.2.0"
libxposed = "102.0.0"

spotless = "8.10.4"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinx-serialization" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodelNav3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle-viewmodelNav3" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
navigation-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation" }
compose = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "compose-adaptive" }
m3x-material-bundle = { module = "top.ltfan.m3x:material-bundle", version.ref = "m3x" }
m3x-settingsPage-core = { module = "top.ltfan.m3x:settings-page-core", version.ref = "m3x" }
m3x-settingsPage-processor = { module = "top.ltfan.m3x:settings-page-processor", version.ref = "m3x" }
m3x-datastore-core = { module = "top.ltfan.m3x:datastore-core", version.ref = "m3x" }
m3x-datastore-processor = { module = "top.ltfan.m3x:datastore-processor", version.ref = "m3x" }
coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
kaidl-compiler = { module = "io.github.goooler.kaidl:kaidl-compiler", version.ref = "kaidl" }
kaidl-runtime = { module = "io.github.goooler.kaidl:kaidl-runtime", version.ref = "kaidl" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }

[plugins]
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
